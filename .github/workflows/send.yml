name: wallpapers
on:
  #schedule:
  #  - cron: "0 5 * * *"   # 09:00 تهران — آلبوم عکس (ویدئو فعلاً غیرفعال)
  workflow_dispatch:
    inputs:
      mode:
        description: "photos = آلبوم / video = ویدئو (فعلاً غیرفعال)"
        required: true
        default: "photos"
        type: choice
        options: [photos, video]

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bot.mjs ${{ github.event.inputs.mode || 'photos' }}
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: remember sent ids
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent.json sent-videos.json
          git diff --cached --quiet || { git commit -m "sent ids [skip ci]" && git push; }
